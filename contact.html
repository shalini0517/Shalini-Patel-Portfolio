<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Shalini Patel</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeUp { animation: fadeUp 0.85s ease-out; }

    /* Background Glows */
    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      z-index: -1;
    }
    .glow-blue { background: #6366f1; top: 10%; left: 10%; }
    .glow-pink { background: #ec4899; bottom: 10%; right: 10%; }

    .contact-card { transition: .3s; }
    .contact-card:hover { transform: translateY(-6px); }
  </style>
</head>

<body class="min-h-screen flex flex-col bg-gradient-to-br from-gray-100 to-gray-300 text-gray-800">

  <!-- Background Glows -->
  <div class="bg-glow glow-blue"></div>
  <div class="bg-glow glow-pink"></div>

  <!-- NAVBAR (Same as Index Page) -->
  <nav class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-xl shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-3">
      <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent"></h1>

      <ul class="flex space-x-6 font-medium">
        <li><a href="index.html" class="hover:text-purple-600 transition">Home</a></li>
        <li><a href="about.html" class="hover:text-purple-600 transition">About</a></li>
        <li><a href="skills.html" class="hover:text-purple-600 transition">Skills</a></li>
        <li><a href="projects.html" class="hover:text-purple-600 transition">Projects</a></li>
        <li><a href="contact.html" class="text-purple-600 font-semibold">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- CONTACT SECTION -->
  <section class="flex-grow flex items-center justify-center px-4 pt-24 pb-14">

    <div class="contact-card bg-white/20 border border-white/30 backdrop-blur-xl p-10 rounded-3xl max-w-2xl w-full shadow-xl animate-fadeUp">

      <h2 class="text-4xl font-bold text-center mb-8 bg-gradient-to-r from-purple-600 to-pink-500 text-transparent bg-clip-text">
        Contact Me
      </h2>

      <!-- Netlify Form -->
      <form name="contact" method="POST" data-netlify="true" class="grid grid-cols-1 gap-6">
        <input type="hidden" name="form-name" value="contact" />

        <input type="text" name="name" placeholder="Your Name" required
          class="p-4 border border-white/40 bg-white/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 placeholder-gray-700">

        <input type="email" name="email" placeholder="Your Email" required
          class="p-4 border border-white/40 bg-white/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 placeholder-gray-700">

        <textarea name="message" placeholder="Your Message" rows="5" required
          class="p-4 border border-white/40 bg-white/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 placeholder-gray-700"></textarea>

        <button type="submit"
          class="bg-gradient-to-r from-purple-500 to-pink-500 text-white py-4 rounded-xl shadow-lg hover:opacity-90 transition font-semibold">
          Send Message
        </button>
      </form>

    </div>
  </section>

  <!-- FOOTER (Same Style as Index) -->
  <footer class="bg-white/80 py-6 shadow-inner backdrop-blur-lg">
    <div class="max-w-4xl mx-auto text-center">

      <p class="text-gray-700 text-lg font-medium">Connect with me</p>

      <div class="flex justify-center space-x-10 mt-3">
        <a href="https://github.com/shalini0517" class="hover:opacity-80 transition">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/github.svg" class="w-7 h-7" />
        </a>

        <a href="https://www.linkedin.com/in/shalini-patel-6343b2218" class="hover:opacity-80 transition">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/linkedin.svg" class="w-7 h-7" />
        </a>

        <a href="mailto:shalinipatel1702@gmail.com" class="hover:opacity-80 transition">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/gmail.svg" class="w-7 h-7" />
        </a>
      </div>

      <p class="text-gray-500 text-sm mt-4">
        © 2025 Shalini Patel. All rights reserved.
      </p>
    </div>
  </footer>

</body>
</html>
